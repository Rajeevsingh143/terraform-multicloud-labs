name: Terraform CI

on:
  push:
    branches:
      - 'feature/**'

permissions:
  contents: write
  pull-requests: write
  id-token: write

env:
  TF_WORKING_DIR: ./env/dev

jobs:

  terraform-ci:

    name: Terraform CI
    runs-on: ubuntu-latest

    steps:

      # ============================================
      # 1. Checkout Repository
      # ============================================
      - name: Checkout Code
        uses: actions/checkout@v4


      # ============================================
      # 2. Setup Terraform
      # ============================================
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3


      # ============================================
      # 3. Azure Login using OIDC
      # ============================================
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}


      # ============================================
      # 4. Verify Azure Login
      # ============================================
      - name: Verify Azure Login
        run: |
          az account show
          az account list --output table


      # ============================================
      # 5. Terraform Init
      # ============================================
      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform init


      # ============================================
      # 6. Terraform Format
      # ============================================
      - name: Terraform Format
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform fmt -check -recursive


      # ============================================
      # 7. Terraform Validate
      # ============================================
      - name: Terraform Validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform validate


      # ============================================
      # 8. Terraform Plan
      # ============================================
      - name: Terraform Plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform plan \
            -var-file="terraform.tfvars" \
            -out=tfplan


      # ============================================
      # 9. Create Pull Request
      # ============================================
      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |

          PR_NUMBER=$(gh pr list \
            --head "${{ github.ref_name }}" \
            --base main \
            --state open \
            --json number \
            --jq '.[0].number')

          if [ -z "$PR_NUMBER" ]; then

            gh pr create \
              --base main \
              --head "${{ github.ref_name }}" \
              --title "Terraform - ${{ github.ref_name }}" \
              --body "Terraform CI completed successfully.

          Checks:
          - Azure Login
          - Terraform Init
          - Terraform Format
          - Terraform Validate
          - Terraform Plan"

          fi


      # ============================================
      # 10. Enable Auto Merge
      # ============================================
      - name: Enable Auto Merge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |

          PR_NUMBER=$(gh pr list \
            --head "${{ github.ref_name }}" \
            --base main \
            --state open \
            --json number \
            --jq '.[0].number')

          if [ -n "$PR_NUMBER" ]; then

            gh pr merge "$PR_NUMBER" \
              --auto \
              --squash \
              --delete-branch

          fi